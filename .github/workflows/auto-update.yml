name: Release Processor

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to process (for example v25)"
        required: true
        type: string
      run_mode:
        description: "Test creates a downloadable artifact; Production updates the live catalog"
        required: true
        type: choice
        options:
          - test
          - production
        default: test

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release and run mode
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RUN_MODE: ${{ inputs.run_mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$EVENT_RELEASE_TAG"
            RUN_MODE="production"
          else
            RELEASE_TAG="$INPUT_RELEASE_TAG"
            RUN_MODE="$INPUT_RUN_MODE"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::A release tag is required"
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "run_mode=$RUN_MODE" >> "$GITHUB_OUTPUT"
          echo "Processing release $RELEASE_TAG in $RUN_MODE mode"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-utils jq unzip imagemagick gcc git curl

          # Build Apple's LZFSE decoder for compiled Assets.car renditions.
          git clone --depth 1 https://github.com/lzfse/lzfse.git "$RUNNER_TEMP/lzfse-src"
          gcc -O2 -o "$RUNNER_TEMP/lzfse" "$RUNNER_TEMP"/lzfse-src/src/lzfse_*.c "$RUNNER_TEMP"/lzfse-src/src/lzvn_*.c -I"$RUNNER_TEMP/lzfse-src/src"

          # Pin the Assets.car parser to a known commit for repeatable builds.
          curl -fsSL "https://raw.githubusercontent.com/xiongnemo/car-unpacker-py/090837ee7d26363da0b96147e90584c6df9e9ccc/car_unpacker.py" -o "$RUNNER_TEMP/car_unpacker.py"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.settings.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" --dir assets

      - name: Ensure Catalog and Icon Directory Exist
        run: |
          set -euo pipefail
          mkdir -p icons
          if [ ! -f apps.json ]; then
            cat > apps.json <<'EOF'
          {
            "name": "Abel's Repo",
            "identifier": "com.umbra.repo",
            "apps": []
          }
          EOF
          fi
          jq -e '.apps | type == "array"' apps.json >/dev/null

      - name: Process All IPAs
        env:
          RELEASE_TAG: ${{ steps.settings.outputs.release_tag }}
          RUN_MODE: ${{ steps.settings.outputs.run_mode }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          mapfile -d '' IPA_FILES < <(find assets -type f -iname '*.ipa' -print0)
          if [ "${#IPA_FILES[@]}" -eq 0 ]; then
            echo "::error::No IPA files found in release ${RELEASE_TAG}"
            exit 1
          fi

          PROCESSED_COUNT=0
          for IPA_PATH in "${IPA_FILES[@]}"; do
            echo "Processing: ${IPA_PATH}"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$IPA_PATH" -d extracted

            if [ ! -d extracted/Payload ]; then
              echo "::warning::Skipping ${IPA_PATH}: Payload directory is missing"
              continue
            fi

            APP_DIR=$(find extracted/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/Info.plist" ]; then
              echo "::warning::Skipping ${IPA_PATH}: no valid .app/Info.plist found"
              continue
            fi

            plistutil -i "$APP_DIR/Info.plist" -f json -o info.json
            APP_NAME=$(jq -r '.CFBundleDisplayName // .CFBundleName // "Unknown"' info.json)
            BUNDLE_ID=$(jq -r '.CFBundleIdentifier // empty' info.json)
            VERSION=$(jq -r '.CFBundleShortVersionString // .CFBundleVersion // "Unknown"' info.json)

            if [ -z "$BUNDLE_ID" ]; then
              echo "::warning::Skipping ${IPA_PATH}: bundle identifier is missing"
              continue
            fi

            IPA_FILE=$(basename "$IPA_PATH")
            IPA_FILE_URL=$(jq -rn --arg value "$IPA_FILE" '$value | @uri')
            DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${IPA_FILE_URL}"

            ICON_FILE="icons/${BUNDLE_ID}.png"
            mkdir -p icon-diagnostics
            ICON_REPORT="icon-diagnostics/${BUNDLE_ID//[^a-zA-Z0-9._-]/_}.json"
            ICON_NAMES_JSON="$RUNNER_TEMP/${BUNDLE_ID//[^a-zA-Z0-9._-]/_}-icon-names.json"
            jq '[
              .CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconFiles[]?,
              .CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName?,
              .CFBundleIconFiles[]?,
              .CFBundleIconName?
            ] | map(select(type == "string" and length > 0)) | unique' info.json > "$ICON_NAMES_JSON"

            if python3 .github/scripts/extract_icon.py "$APP_DIR" "$ICON_NAMES_JSON" "$ICON_FILE" "$RUNNER_TEMP/car_unpacker.py" "$RUNNER_TEMP/lzfse" "$ICON_REPORT"; then
              ICON_URL="https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/${ICON_FILE}"
              echo "Using extracted app icon for ${BUNDLE_ID}"
            else
              # The repo's existing standalone default.png is the guaranteed fallback.
              echo "::warning::No valid app icon found for ${BUNDLE_ID}; using the repository's icons/default.png"
              ICON_URL="https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/icons/default.png"
            fi

            # Production runs must never replace a newer catalog version with an older one.
            CURRENT_VERSION=$(jq -r --arg bundle "$BUNDLE_ID" '.apps[]? | select(.bundleIdentifier == $bundle) | .version' apps.json | head -n 1)
            if [ "$RUN_MODE" = "production" ] && [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "null" ]; then
              if dpkg --compare-versions "$VERSION" lt "$CURRENT_VERSION"; then
                echo "::warning::Skipping downgrade for ${APP_NAME}: catalog has ${CURRENT_VERSION}, release has ${VERSION}"
                continue
              fi
            fi

            jq \
              --arg bundle "$BUNDLE_ID" \
              --arg name "$APP_NAME" \
              --arg version "$VERSION" \
              --arg date "$(date -u +%F)" \
              --arg download "$DOWNLOAD_URL" \
              --arg icon "$ICON_URL" \
              '
              .apps = (.apps // [])
              | .apps |= map(select(.bundleIdentifier != $bundle))
              | .apps += [{
                  name: $name,
                  bundleIdentifier: $bundle,
                  developerName: "Abel",
                  version: $version,
                  versionDate: $date,
                  downloadURL: $download,
                  localizedDescription: ($name + " IPA"),
                  iconURL: $icon
                }]
              ' apps.json > apps.json.tmp
            mv apps.json.tmp apps.json
            PROCESSED_COUNT=$((PROCESSED_COUNT + 1))
          done

          if [ "$PROCESSED_COUNT" -eq 0 ]; then
            echo "::error::No valid IPA applications were added to the catalog"
            exit 1
          fi

          jq -e '.apps | type == "array"' apps.json >/dev/null
          echo "Successfully processed ${PROCESSED_COUNT} IPA(s)"
          jq -r '.apps[] | [.name, .bundleIdentifier, .version] | @tsv' apps.json

      - name: Upload test results
        if: steps.settings.outputs.run_mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: abels-repo-test-${{ steps.settings.outputs.release_tag }}
          path: |
            apps.json
            icons/
            icon-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Commit Production Changes
        if: steps.settings.outputs.run_mode == 'production'
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/

          if git diff --cached --quiet; then
            echo "No catalog or icon changes to commit"
            exit 0
          fi

          git commit -m "Update app catalog and icons"
          git push origin "HEAD:${BRANCH_NAME}"
